<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antifragile Traffic Control · SUMA</title>
    <meta name="description" content="SUMA Antifragile Traffic Control: choose the perimeter and train the traffic-light agent." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The saved theme before the first paint (no flash): the same code as `themeScript` from @rhoe/ui.
         Keep it inline and first in <head>. With a Content-Security-Policy, allow it by hash. -->
    <script>(function(d){try{var t=localStorage.getItem('rh-theme');if(t==='light'||t==='dark'||t==='system')d.setAttribute('data-rh-theme',t)}catch(e){}})(document.documentElement)</script>
    <!-- The saved language, so <html lang> is right before React starts -->
    <script>(function(d){try{var l=localStorage.getItem('suma-atc-locale');if(l==='en'||l==='el')d.lang=l}catch(e){}})(document.documentElement)</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
